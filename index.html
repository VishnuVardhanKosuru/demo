<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YAAD — Say It Once. It Remembers.</title>
<meta name="description" content="YAAD - Your AI memory assistant. Say it once, it remembers. Product launch film.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN SYSTEM
   ============================================================ */
:root {
  --bg-dark: #0a0a0f;
  --bg-card: rgba(255,255,255,0.04);
  --bg-glass: rgba(255,255,255,0.06);
  --border-glass: rgba(255,255,255,0.08);
  --text-primary: #f0f0f5;
  --text-secondary: rgba(240,240,245,0.6);
  --text-dim: rgba(240,240,245,0.3);
  --accent-blue: #4a9eff;
  --accent-violet: #8b5cf6;
  --accent-teal: #2dd4bf;
  --accent-amber: #f59e0b;
  --accent-green: #10b981;
  --accent-red: #ef4444;
  --accent-pink: #ec4899;
  --glow-blue: rgba(74,158,255,0.3);
  --glow-violet: rgba(139,92,246,0.3);
  --font-display: 'Space Grotesk', sans-serif;
  --font-body: 'Inter', sans-serif;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: var(--bg-dark);
  font-family: var(--font-body);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
}

/* ============================================================
   LAYOUT
   ============================================================ */
#app {
  position: fixed; inset: 0;
  overflow: hidden;
  background: var(--bg-dark);
}

#fx-canvas {
  position: absolute; inset: 0;
  z-index: 10;
  pointer-events: none;
}

/* Background layers */
.bg-layer {
  position: absolute; inset: -60px;
  background-size: cover;
  background-position: center;
  opacity: 0;
  transition: opacity 1.5s ease;
  filter: brightness(0.3) blur(4px);
  z-index: 1;
}
.bg-layer.active { opacity: 1; }

#bg-office { background-image: url('assets/bg-office.jpg'); }
#bg-street { background-image: url('assets/bg-street.jpg'); }
#bg-home   { background-image: url('assets/bg-home.jpg'); }
#bg-folder { background-image: url('assets/bg-folder.jpg'); }
#bg-dark   { background: radial-gradient(ellipse at 50% 40%, #0f0f2a 0%, #0a0a0f 70%); }

/* Dark overlay for depth */
#bg-overlay {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at 50% 50%, transparent 20%, rgba(10,10,15,0.7) 80%);
  z-index: 2;
}

/* ============================================================
   PHONE MOCKUP
   ============================================================ */
#phone-container {
  position: absolute;
  z-index: 20;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(1);
  transition: transform 1.5s cubic-bezier(0.16, 1, 0.3, 1),
              opacity 0.8s ease;
  opacity: 0;
}

#phone {
  width: 280px; height: 580px;
  background: #1a1a2e;
  border-radius: 40px;
  border: 2px solid rgba(255,255,255,0.1);
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.05),
    0 25px 80px rgba(0,0,0,0.6),
    0 0 60px rgba(74,158,255,0.08),
    inset 0 0 30px rgba(0,0,0,0.3);
  overflow: hidden;
  position: relative;
}

#phone-notch {
  position: absolute;
  top: 8px; left: 50%;
  transform: translateX(-50%);
  width: 100px; height: 28px;
  background: #0a0a0f;
  border-radius: 0 0 18px 18px;
  z-index: 5;
}

#phone-notch::after {
  content: '';
  position: absolute;
  top: 10px; left: 50%;
  transform: translateX(-50%);
  width: 8px; height: 8px;
  background: #1a1a2e;
  border-radius: 50%;
  border: 1.5px solid #333;
}

#phone-status-bar {
  position: absolute; top: 0; left: 0; right: 0;
  height: 44px;
  padding: 12px 24px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 4;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-primary);
}

#phone-screen {
  position: absolute;
  top: 2px; left: 2px; right: 2px; bottom: 2px;
  border-radius: 38px;
  background: linear-gradient(180deg, #0f0f1e 0%, #0a0a14 100%);
  overflow: hidden;
  z-index: 3;
}

#phone-content {
  position: absolute;
  top: 50px; left: 0; right: 0; bottom: 30px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

#phone-home-bar {
  position: absolute;
  bottom: 8px; left: 50%;
  transform: translateX(-50%);
  width: 120px; height: 4px;
  background: rgba(255,255,255,0.2);
  border-radius: 2px;
  z-index: 4;
}

/* ============================================================
   NOTIFICATION CARDS
   ============================================================ */
.notif-card {
  position: absolute;
  padding: 12px 16px;
  background: var(--bg-glass);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border-glass);
  border-radius: 14px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-primary);
  white-space: nowrap;
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  z-index: 25;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}

.notif-card .notif-icon {
  display: inline-block;
  margin-right: 8px;
  font-size: 14px;
}

.notif-card.visible {
  opacity: 1;
  transform: translateY(0);
}

.notif-card.chaos {
  animation: notifFloat 3s ease-in-out infinite;
}

@keyframes notifFloat {
  0%, 100% { transform: translateY(0px) rotate(0deg); }
  33% { transform: translateY(-8px) rotate(1deg); }
  66% { transform: translateY(4px) rotate(-0.5deg); }
}

/* ============================================================
   MEMORY CARD
   ============================================================ */
.memory-card {
  background: var(--bg-glass);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--border-glass);
  border-radius: 16px;
  padding: 20px;
  width: 240px;
  opacity: 0;
  transform: scale(0.9) translateY(10px);
  transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
}

.memory-card.visible {
  opacity: 1;
  transform: scale(1) translateY(0);
}

.memory-card .mem-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 0;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  font-size: 13px;
}

.memory-card .mem-row:last-child { border-bottom: none; }

.memory-card .mem-label {
  color: var(--text-secondary);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.memory-card .mem-value {
  font-weight: 600;
  color: var(--text-primary);
}

.memory-card .mem-status {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
}

.mem-status.pending { background: rgba(245,158,11,0.15); color: var(--accent-amber); }
.mem-status.paid { background: rgba(16,185,129,0.15); color: var(--accent-green); }

/* ============================================================
   CINEMATIC TEXT
   ============================================================ */
#scene-text-container {
  position: absolute;
  bottom: 100px;
  left: 50%; transform: translateX(-50%);
  z-index: 30;
  text-align: center;
  pointer-events: none;
}

.scene-text {
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 400;
  letter-spacing: -0.5px;
  line-height: 1.4;
  color: var(--text-primary);
  opacity: 0;
  transform: translateY(30px);
  transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
  max-width: 700px;
}

.scene-text.visible {
  opacity: 1;
  transform: translateY(0);
}

.scene-text.exiting {
  opacity: 0;
  transform: translateY(-20px);
}

/* ============================================================
   VOICEOVER SUBTITLES
   ============================================================ */
#voiceover-container {
  position: absolute;
  bottom: 40px;
  left: 50%; transform: translateX(-50%);
  z-index: 35;
  text-align: center;
  pointer-events: none;
}

.voiceover-text {
  font-family: var(--font-body);
  font-size: 16px;
  font-weight: 300;
  letter-spacing: 0.2px;
  line-height: 1.6;
  color: rgba(240,240,245,0.75);
  opacity: 0;
  transform: translateY(10px);
  transition: all 0.7s ease;
  max-width: 600px;
  font-style: italic;
}

.voiceover-text.visible {
  opacity: 1;
  transform: translateY(0);
}

/* ============================================================
   LISTENING UI
   ============================================================ */
.listening-ui {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
  height: 40px;
  opacity: 0;
  transition: opacity 0.5s ease;
}

.listening-ui.active { opacity: 1; }

.listening-bar {
  width: 3px;
  background: var(--accent-blue);
  border-radius: 2px;
  animation: listenPulse 0.8s ease-in-out infinite;
}

@keyframes listenPulse {
  0%, 100% { height: 8px; opacity: 0.4; }
  50% { height: 28px; opacity: 1; }
}

.listening-bar:nth-child(2) { animation-delay: 0.1s; }
.listening-bar:nth-child(3) { animation-delay: 0.2s; }
.listening-bar:nth-child(4) { animation-delay: 0.15s; }
.listening-bar:nth-child(5) { animation-delay: 0.25s; }
.listening-bar:nth-child(6) { animation-delay: 0.05s; }
.listening-bar:nth-child(7) { animation-delay: 0.18s; }

/* ============================================================
   SPEECH BUBBLE
   ============================================================ */
.speech-text {
  font-family: var(--font-body);
  font-size: 15px;
  font-weight: 400;
  color: var(--text-primary);
  opacity: 0;
  transition: all 0.6s ease;
  text-align: center;
  padding: 8px 0;
}

.speech-text.visible { opacity: 1; }

.speech-text .highlight {
  color: var(--accent-blue);
  font-weight: 600;
}

/* ============================================================
   MAP VIEW
   ============================================================ */
#map-container {
  position: absolute; inset: 0;
  z-index: 15;
  opacity: 0;
  transition: opacity 1s ease;
}

#map-canvas {
  width: 100%; height: 100%;
}

/* ============================================================
   TECH NODES
   ============================================================ */
.tech-node {
  position: absolute;
  padding: 10px 20px;
  background: var(--bg-glass);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border-glass);
  border-radius: 12px;
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 500;
  color: var(--text-primary);
  opacity: 0;
  transform: scale(0.8);
  transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
  z-index: 25;
  text-align: center;
}

.tech-node.visible {
  opacity: 1;
  transform: scale(1);
}

.tech-node .node-icon {
  font-size: 20px;
  margin-bottom: 4px;
  display: block;
}

.tech-highlight {
  color: var(--accent-blue);
  font-weight: 600;
}

/* ============================================================
   FINAL LOGO
   ============================================================ */
#final-logo {
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  z-index: 40;
  text-align: center;
  opacity: 0;
  transition: opacity 1s ease;
}

#final-logo .logo-text {
  font-family: var(--font-display);
  font-size: 72px;
  font-weight: 800;
  letter-spacing: 12px;
  background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-violet) 50%, var(--accent-teal) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-transform: uppercase;
}

#final-logo .tagline {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 400;
  color: var(--text-secondary);
  margin-top: 16px;
  letter-spacing: 2px;
}

#final-logo .subtext {
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 300;
  color: var(--text-dim);
  margin-top: 24px;
  letter-spacing: 1px;
}

#final-logo .team-credits {
  margin-top: 32px;
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 16px 36px;
  border-radius: 999px;
  background: rgba(15, 23, 42, 0.65);
  border: 1px solid rgba(139, 92, 246, 0.35);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), 0 0 24px rgba(139, 92, 246, 0.2);
  opacity: 0;
  transform: translateY(16px);
  transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), transform 1s cubic-bezier(0.16, 1, 0.3, 1);
}

#final-logo .team-credits.visible {
  opacity: 1;
  transform: translateY(0);
}

#final-logo .team-header {
  font-family: var(--font-display);
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 3px;
  color: var(--accent-teal);
}

#final-logo .team-brand {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 2px;
  background: linear-gradient(135deg, #ffffff 0%, #c4b5fd 50%, #93c5fd 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

#final-logo .team-members {
  display: flex;
  align-items: center;
  gap: 14px;
  font-family: var(--font-body);
  font-size: 15px;
  font-weight: 400;
  color: #e2e8f0;
  letter-spacing: 0.5px;
}

#final-logo .member-name {
  color: #f1f5f9;
  font-weight: 500;
  text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
}

#final-logo .member-divider {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--accent-violet);
  box-shadow: 0 0 8px var(--accent-violet);
}

/* ============================================================
   PLAY OVERLAY
   ============================================================ */
#play-overlay {
  position: fixed; inset: 0;
  z-index: 100;
  background: var(--bg-dark);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: opacity 0.8s ease;
}

#play-overlay.hidden {
  opacity: 0;
  pointer-events: none;
}

#play-overlay .play-title {
  font-family: var(--font-display);
  font-size: 48px;
  font-weight: 700;
  letter-spacing: 8px;
  background: linear-gradient(135deg, var(--accent-blue), var(--accent-violet));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 32px;
}

#play-overlay .play-btn {
  width: 80px; height: 80px;
  border: 2px solid rgba(255,255,255,0.15);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.4s ease;
  position: relative;
}

#play-overlay .play-btn::after {
  content: '';
  width: 0; height: 0;
  border-left: 22px solid var(--text-primary);
  border-top: 14px solid transparent;
  border-bottom: 14px solid transparent;
  margin-left: 5px;
}

#play-overlay .play-btn:hover {
  border-color: var(--accent-blue);
  box-shadow: 0 0 40px var(--glow-blue);
  transform: scale(1.05);
}

#play-overlay .play-sub {
  font-size: 14px;
  color: var(--text-dim);
  margin-top: 24px;
  letter-spacing: 1px;
}

/* ============================================================
   NOTIFICATION POPUP (in-phone)
   ============================================================ */
.phone-notification {
  position: absolute;
  top: 56px; left: 12px; right: 12px;
  background: rgba(30,30,60,0.9);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 14px;
  padding: 12px 14px;
  opacity: 0;
  transform: translateY(-20px);
  transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  z-index: 10;
}

.phone-notification.visible {
  opacity: 1;
  transform: translateY(0);
}

.phone-notification .pn-app {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--accent-blue);
  margin-bottom: 4px;
}

.phone-notification .pn-text {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-primary);
  line-height: 1.3;
}

.phone-notification .pn-action {
  display: inline-block;
  margin-top: 8px;
  padding: 4px 14px;
  background: var(--accent-blue);
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  color: white;
  cursor: pointer;
}

/* ============================================================
   CAMERA VIEWFINDER
   ============================================================ */
.viewfinder {
  position: absolute; inset: 0;
  opacity: 0;
  transition: opacity 0.5s ease;
}

.viewfinder.active { opacity: 1; }

.vf-corners {
  position: absolute;
  inset: 60px 30px 40px;
  border: 1.5px solid rgba(255,255,255,0.4);
  border-radius: 4px;
}

.vf-crosshair {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 30px; height: 30px;
}

.vf-crosshair::before, .vf-crosshair::after {
  content: '';
  position: absolute;
  background: rgba(255,255,255,0.6);
}

.vf-crosshair::before {
  top: 50%; left: 0;
  width: 100%; height: 1px;
  transform: translateY(-50%);
}

.vf-crosshair::after {
  left: 50%; top: 0;
  width: 1px; height: 100%;
  transform: translateX(-50%);
}

.vf-rec {
  position: absolute;
  top: 68px; left: 40px;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 600;
  color: var(--accent-red);
}

.vf-rec::before {
  content: '';
  width: 6px; height: 6px;
  background: var(--accent-red);
  border-radius: 50%;
  animation: recBlink 1s ease infinite;
}

@keyframes recBlink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.2; }
}

/* ============================================================
   CAPTURE FLASH
   ============================================================ */
.capture-flash {
  position: absolute; inset: 0;
  background: white;
  opacity: 0;
  z-index: 20;
  pointer-events: none;
  border-radius: 38px;
}

.capture-flash.flash {
  animation: flashAnim 0.4s ease-out forwards;
}

@keyframes flashAnim {
  0% { opacity: 0.8; }
  100% { opacity: 0; }
}

/* ============================================================
   FLOATING MEMORY CARDS (Scene 8)
   ============================================================ */
.float-mem-card {
  position: absolute;
  padding: 10px 14px;
  background: var(--bg-glass);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border-glass);
  border-radius: 12px;
  font-size: 12px;
  color: var(--text-primary);
  opacity: 0;
  transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
  z-index: 25;
  white-space: nowrap;
}

.float-mem-card.visible {
  opacity: 0.8;
}

.float-mem-card.collapse {
  opacity: 0;
  transform: translate(-50%, -50%) scale(0) !important;
  left: 50% !important;
  top: 50% !important;
}

/* ============================================================
   MICRO ANIMATIONS & UTILITIES
   ============================================================ */
@keyframes gentlePulse {
  0%, 100% { transform: scale(1); opacity: 0.6; }
  50% { transform: scale(1.05); opacity: 1; }
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes shimmer {
  0% { background-position: -200% center; }
  100% { background-position: 200% center; }
}

.shimmer-text {
  background: linear-gradient(90deg,
    var(--text-primary) 0%,
    var(--accent-blue) 25%,
    var(--text-primary) 50%,
    var(--accent-violet) 75%,
    var(--text-primary) 100%);
  background-size: 200% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: shimmer 3s linear infinite;
}

/* Geofence ring */
.geofence-ring {
  position: absolute;
  border: 2px solid var(--accent-teal);
  border-radius: 50%;
  opacity: 0;
  transition: opacity 0.8s ease;
}

.geofence-ring.visible {
  opacity: 0.6;
  animation: geoPulse 2s ease-in-out infinite;
}

@keyframes geoPulse {
  0%, 100% { transform: scale(1); opacity: 0.6; border-color: var(--accent-teal); }
  50% { transform: scale(1.08); opacity: 0.3; border-color: var(--accent-blue); }
}

/* Tech connection line */
.tech-line {
  position: absolute;
  height: 2px;
  background: linear-gradient(90deg, var(--accent-blue), var(--accent-violet));
  opacity: 0;
  transform-origin: left center;
  transition: opacity 0.5s ease;
  z-index: 24;
}

.tech-line.visible { opacity: 0.5; }

/* Scene-level camera wrapper */
#camera-wrapper {
  position: absolute; inset: 0;
  z-index: 5;
  transition: transform 2s cubic-bezier(0.16, 1, 0.3, 1),
              filter 1.5s ease;
}

/* Search animation */
.search-ring {
  position: absolute;
  width: 60px; height: 60px;
  border: 2px solid var(--accent-blue);
  border-radius: 50%;
  opacity: 0;
  z-index: 25;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
}

<script>
/* ============================================================
   CORE ENGINE
   ============================================================ */

// --- Easing Functions ---
const ease = {
  inOut: t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  out: t => 1 - Math.pow(1 - t, 3),
  inQuad: t => t * t,
  outQuad: t => 1 - (1 - t) * (1 - t),
  outBack: t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  linear: t => t,
};

function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function mapRange(v, inMin, inMax, outMin, outMax) {
  return clamp(outMin + ((v - inMin) / (inMax - inMin)) * (outMax - outMin), Math.min(outMin, outMax), Math.max(outMin, outMax));
}

// --- DOM Helpers ---
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
function el(tag, cls, parent, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html) e.innerHTML = html;
  if (parent) parent.appendChild(e);
  return e;
}

// --- Canvas Setup ---
const fxCanvas = $('#fx-canvas');
const fxCtx = fxCanvas.getContext('2d');
const mapCanvas = $('#map-canvas');
const mapCtx = mapCanvas.getContext('2d');

function resizeCanvases() {
  const dpr = window.devicePixelRatio || 1;
  [fxCanvas, mapCanvas].forEach(c => {
    c.width = window.innerWidth * dpr;
    c.height = window.innerHeight * dpr;
    c.style.width = window.innerWidth + 'px';
    c.style.height = window.innerHeight + 'px';
    c.getContext('2d').scale(dpr, dpr);
  });
}
resizeCanvases();
window.addEventListener('resize', resizeCanvases);

const W = () => window.innerWidth;
const H = () => window.innerHeight;

// --- Particle System ---
class Particle {
  constructor(x, y, opts = {}) {
    this.x = x; this.y = y;
    this.vx = opts.vx || (Math.random() - 0.5) * 2;
    this.vy = opts.vy || (Math.random() - 0.5) * 2;
    this.size = opts.size || 2;
    this.alpha = opts.alpha || 1;
    this.decay = opts.decay || 0.01;
    this.color = opts.color || '74,158,255';
    this.life = 1;
    this.gravity = opts.gravity || 0;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vy += this.gravity;
    this.life -= this.decay;
    this.vx *= 0.99;
    this.vy *= 0.99;
  }

  draw(ctx) {
    if (this.life <= 0) return;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${this.color}, ${this.life * this.alpha})`;
    ctx.fill();
  }

  get alive() { return this.life > 0; }
}

let particles = [];

function emitParticles(x, y, count, opts) {
  for (let i = 0; i < count; i++) {
    particles.push(new Particle(x, y, {
      vx: (Math.random() - 0.5) * (opts.speed || 3),
      vy: (Math.random() - 0.5) * (opts.speed || 3),
      size: opts.size || (1 + Math.random() * 2),
      decay: opts.decay || (0.005 + Math.random() * 0.01),
      color: opts.color || '74,158,255',
      alpha: opts.alpha || 0.8,
      gravity: opts.gravity || 0,
    }));
  }
}

// --- Ambient Particles ---
let ambientParticles = [];
function initAmbient() {
  for (let i = 0; i < 40; i++) {
    ambientParticles.push({
      x: Math.random() * W(),
      y: Math.random() * H(),
      size: 0.5 + Math.random() * 1.5,
      speed: 0.1 + Math.random() * 0.3,
      alpha: 0.1 + Math.random() * 0.2,
      phase: Math.random() * Math.PI * 2,
    });
  }
}
initAmbient();

function drawAmbient(ctx, t) {
  ambientParticles.forEach(p => {
    p.y -= p.speed;
    p.x += Math.sin(t * 0.001 + p.phase) * 0.3;
    if (p.y < -10) { p.y = H() + 10; p.x = Math.random() * W(); }
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(74,158,255, ${p.alpha})`;
    ctx.fill();
  });
}

// --- Audio Engine ---
// ============================================================
// CINEMATIC AUDIO ENGINE — BGM + SFX + VOICEOVER
// ============================================================

class AudioEngine {
  constructor() {
    this.ctx = null;
    this.masterGain = null;
    this.bgmGain = null;
    this.sfxGain = null;
    this.started = false;
    this.padOscs = [];
    this.padGains = [];
    this.padFilter = null;
    this.arpInterval = null;
    this.currentChordIdx = -1;
    this.pulseInterval = null;
  }

  // --- Note Frequencies ---
  static noteFreq(note, octave) {
    const notes = { C:0, 'C#':1, D:2, 'D#':3, E:4, F:5, 'F#':6, G:7, 'G#':8, A:9, 'A#':10, B:11 };
    return 440 * Math.pow(2, (notes[note] - 9) / 12 + (octave - 4));
  }

  // --- Chord Definitions (per scene mood) ---
  static get CHORDS() {
    const n = AudioEngine.noteFreq;
    return [
      // Scene 1: Tense, uneasy — Am add9 with slight cluster
      { notes: [n('A',2), n('C',3), n('E',3), n('B',3)], filter: 400, padVol: 0.035, label: 'tense' },
      // Scene 2: Relief — C major 7
      { notes: [n('C',3), n('E',3), n('G',3), n('B',3)], filter: 800, padVol: 0.04, label: 'relief' },
      // Scene 3: Confident — F major 9
      { notes: [n('F',2), n('A',2), n('C',3), n('G',3)], filter: 1000, padVol: 0.04, label: 'confident' },
      // Scene 4: Curious, exploratory — Dm7
      { notes: [n('D',3), n('F',3), n('A',3), n('C',4)], filter: 1200, padVol: 0.038, label: 'curious' },
      // Scene 5: Intimate warmth — Bb major 7
      { notes: [n('A#',2), n('D',3), n('F',3), n('A',3)], filter: 900, padVol: 0.04, label: 'warm' },
      // Scene 6: Emotional payoff — G major add9
      { notes: [n('G',2), n('B',2), n('D',3), n('A',3)], filter: 1400, padVol: 0.045, label: 'payoff' },
      // Scene 7: Clean, precise — Em11
      { notes: [n('E',2), n('B',2), n('D',3), n('A',3)], filter: 1800, padVol: 0.035, label: 'tech' },
      // Scene 8: Grand resolution — C major add9
      { notes: [n('C',3), n('E',3), n('G',3), n('D',4)], filter: 2000, padVol: 0.05, label: 'resolve' },
    ];
  }

  // --- Arp Patterns per mood ---
  static get ARP_PATTERNS() {
    return {
      tense:    [0, 2, 1, 3],
      relief:   [0, 1, 2, 3, 2, 1],
      confident:[0, 2, 3, 2],
      curious:  [3, 2, 0, 1, 3, 0],
      warm:     [0, 1, 2, 3],
      payoff:   [0, 1, 2, 3, 3, 2, 1, 0],
      tech:     [0, 3, 1, 2, 3, 0],
      resolve:  [0, 1, 2, 3, 2, 1],
    };
  }

  init() {
    if (this.started) return;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();

    // Master gain
    this.masterGain = this.ctx.createGain();
    this.masterGain.gain.value = 0.35;
    this.masterGain.connect(this.ctx.destination);

    // BGM bus
    this.bgmGain = this.ctx.createGain();
    this.bgmGain.gain.value = 1.0;
    this.bgmGain.connect(this.masterGain);

    // SFX bus
    this.sfxGain = this.ctx.createGain();
    this.sfxGain.gain.value = 0.7;
    this.sfxGain.connect(this.masterGain);

    // --- Pad Synthesizer ---
    // Main low-pass filter for all pads
    this.padFilter = this.ctx.createBiquadFilter();
    this.padFilter.type = 'lowpass';
    this.padFilter.frequency.value = 400;
    this.padFilter.Q.value = 1.5;
    this.padFilter.connect(this.bgmGain);

    // Reverb (convolver approximation using delay/feedback)
    this.reverbGain = this.ctx.createGain();
    this.reverbGain.gain.value = 0.25;
    const delay1 = this.ctx.createDelay();
    delay1.delayTime.value = 0.12;
    const delay2 = this.ctx.createDelay();
    delay2.delayTime.value = 0.24;
    const fbGain = this.ctx.createGain();
    fbGain.gain.value = 0.3;
    const reverbFilter = this.ctx.createBiquadFilter();
    reverbFilter.type = 'lowpass';
    reverbFilter.frequency.value = 2000;
    this.padFilter.connect(delay1);
    delay1.connect(reverbFilter);
    reverbFilter.connect(delay2);
    delay2.connect(fbGain);
    fbGain.connect(delay1);
    delay2.connect(this.reverbGain);
    this.reverbGain.connect(this.bgmGain);

    // Create 8 oscillators for pad (2 per chord note for detuned richness)
    for (let i = 0; i < 8; i++) {
      const osc = this.ctx.createOscillator();
      osc.type = i % 2 === 0 ? 'sine' : 'triangle';
      osc.frequency.value = 100;
      // Detune alternating oscs for thickness
      osc.detune.value = (i % 2 === 0) ? -6 : 6;
      const gain = this.ctx.createGain();
      gain.gain.value = 0;
      osc.connect(gain);
      gain.connect(this.padFilter);
      osc.start();
      this.padOscs.push(osc);
      this.padGains.push(gain);
    }

    // --- Sub Bass ---
    this.subOsc = this.ctx.createOscillator();
    this.subOsc.type = 'sine';
    this.subOsc.frequency.value = 55;
    this.subGain = this.ctx.createGain();
    this.subGain.gain.value = 0.05;
    const subFilter = this.ctx.createBiquadFilter();
    subFilter.type = 'lowpass';
    subFilter.frequency.value = 120;
    this.subOsc.connect(subFilter).connect(this.subGain).connect(this.bgmGain);
    this.subOsc.start();

    // --- Noise texture ---
    const bufferSize = this.ctx.sampleRate * 2;
    const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const output = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
    this.noise = this.ctx.createBufferSource();
    this.noise.buffer = noiseBuffer;
    this.noise.loop = true;
    this.noiseFilter = this.ctx.createBiquadFilter();
    this.noiseFilter.type = 'lowpass';
    this.noiseFilter.frequency.value = 300;
    this.noiseGain = this.ctx.createGain();
    this.noiseGain.gain.value = 0.012;
    this.noise.connect(this.noiseFilter).connect(this.noiseGain).connect(this.bgmGain);
    this.noise.start();

    // --- LFO for breathing ---
    this.lfo = this.ctx.createOscillator();
    this.lfo.type = 'sine';
    this.lfo.frequency.value = 0.06;
    const lfoGain = this.ctx.createGain();
    lfoGain.gain.value = 0.008;
    this.lfo.connect(lfoGain);
    // Connect LFO to pad gains for subtle breathing
    this.padGains.forEach(g => lfoGain.connect(g.gain));
    this.lfo.start();

    this.started = true;
    this.currentChordIdx = -1;

    // --- Start BGM immediately with fast fade-in ---
    this.changeChord(0, 0.8);
  }

  // --- Transition to a chord by index (smooth crossfade) ---
  changeChord(idx, overrideFade) {
    if (!this.started || idx === this.currentChordIdx) return;
    this.currentChordIdx = idx;
    const chord = AudioEngine.CHORDS[idx];
    const now = this.ctx.currentTime;
    const fadeTime = overrideFade || 2.5;

    // Update pad oscillator frequencies and gains
    chord.notes.forEach((freq, i) => {
      // Two oscs per note
      const osc1 = this.padOscs[i * 2];
      const osc2 = this.padOscs[i * 2 + 1];
      const g1 = this.padGains[i * 2];
      const g2 = this.padGains[i * 2 + 1];

      osc1.frequency.exponentialRampToValueAtTime(freq, now + fadeTime * 0.5);
      osc2.frequency.exponentialRampToValueAtTime(freq * 1.002, now + fadeTime * 0.5);

      g1.gain.cancelScheduledValues(now);
      g2.gain.cancelScheduledValues(now);
      g1.gain.linearRampToValueAtTime(chord.padVol, now + fadeTime);
      g2.gain.linearRampToValueAtTime(chord.padVol * 0.6, now + fadeTime);
    });

    // Sweep filter
    this.padFilter.frequency.cancelScheduledValues(now);
    this.padFilter.frequency.exponentialRampToValueAtTime(chord.filter, now + fadeTime);

    // Update sub bass root
    const subFreq = chord.notes[0] / 2;
    this.subOsc.frequency.exponentialRampToValueAtTime(Math.max(subFreq, 30), now + fadeTime);

    // Update noise texture brightness
    const noiseFreq = chord.filter * 0.5;
    this.noiseFilter.frequency.exponentialRampToValueAtTime(noiseFreq, now + fadeTime);
  }

  // --- Arpeggiator ---
  startArp(chordIdx, bpm = 140, volume = 0.025) {
    this.stopArp();
    if (!this.started) return;

    const chord = AudioEngine.CHORDS[chordIdx];
    const pattern = AudioEngine.ARP_PATTERNS[chord.label];
    const interval = (60 / bpm) * 1000; // ms per step
    let step = 0;

    this.arpInterval = setInterval(() => {
      if (!this.started) return;
      const noteIdx = pattern[step % pattern.length];
      const freq = chord.notes[noteIdx] * 2; // One octave up for sparkle

      const osc = this.ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = freq;

      const g = this.ctx.createGain();
      const now = this.ctx.currentTime;
      g.gain.setValueAtTime(0, now);
      g.gain.linearRampToValueAtTime(volume, now + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);

      const f = this.ctx.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.value = 3000;

      osc.connect(f).connect(g).connect(this.bgmGain);
      osc.start(now);
      osc.stop(now + 0.6);

      step++;
    }, interval);
  }

  stopArp() {
    if (this.arpInterval) { clearInterval(this.arpInterval); this.arpInterval = null; }
  }

  // --- Rhythmic Pulse ---
  startPulse(bpm = 70, volume = 0.02) {
    this.stopPulse();
    if (!this.started) return;
    const interval = (60 / bpm) * 1000;

    this.pulseInterval = setInterval(() => {
      if (!this.started) return;
      const now = this.ctx.currentTime;

      // Kick-like pulse
      const osc = this.ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(100, now);
      osc.frequency.exponentialRampToValueAtTime(40, now + 0.15);

      const g = this.ctx.createGain();
      g.gain.setValueAtTime(volume, now);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.3);

      osc.connect(g).connect(this.bgmGain);
      osc.start(now);
      osc.stop(now + 0.35);
    }, interval);
  }

  stopPulse() {
    if (this.pulseInterval) { clearInterval(this.pulseInterval); this.pulseInterval = null; }
  }

  // --- Scene-driven BGM update (called each frame) ---
  updateBGM(filmTime) {
    if (!this.started) return;

    // Determine which chord to play based on scene
    let chordIdx;
    if      (filmTime < 13) chordIdx = 0;
    else if (filmTime < 26) chordIdx = 1;
    else if (filmTime < 37) chordIdx = 2;
    else if (filmTime < 49) chordIdx = 3;
    else if (filmTime < 60) chordIdx = 4;
    else if (filmTime < 70) chordIdx = 5;
    else if (filmTime < 80) chordIdx = 6;
    else                    chordIdx = 7;

    this.changeChord(chordIdx);

    // Start/stop arpeggiator based on scene
    if (filmTime >= 26 && filmTime < 37 && !this.arpInterval) {
      this.startArp(chordIdx, 130, 0.02);
    } else if (filmTime >= 37 && filmTime < 49 && (!this.arpInterval || this._arpChord !== chordIdx)) {
      this.startArp(chordIdx, 150, 0.025);
      this._arpChord = chordIdx;
    } else if (filmTime >= 60 && filmTime < 70 && (!this.arpInterval || this._arpChord !== chordIdx)) {
      this.startArp(chordIdx, 160, 0.028);
      this._arpChord = chordIdx;
    } else if (filmTime >= 80 && (!this.arpInterval || this._arpChord !== chordIdx)) {
      this.startArp(chordIdx, 120, 0.03);
      this._arpChord = chordIdx;
    } else if ((filmTime < 26 || (filmTime >= 49 && filmTime < 60) || (filmTime >= 70 && filmTime < 80)) && this.arpInterval) {
      this.stopArp();
      this._arpChord = -1;
    }

    // Start subtle pulse from scene 3 onwards
    if (filmTime >= 26 && !this.pulseInterval) {
      this.startPulse(70, 0.015);
    }

    // --- Dynamic ducking: lower BGM when voiceover is speaking ---
    const now = this.ctx.currentTime;
    const voActive = voiceover && voiceover.isSpeaking;

    if (filmTime >= 85) {
      // Final swell — music takes centre stage
      this.bgmGain.gain.linearRampToValueAtTime(voActive ? 0.6 : 1.2, now + 0.8);
    } else if (voActive) {
      // Duck BGM behind narration voice
      this.bgmGain.gain.linearRampToValueAtTime(0.35, now + 0.4);
    } else {
      // No voice — let BGM breathe at comfortable level
      this.bgmGain.gain.linearRampToValueAtTime(0.75, now + 0.6);
    }
  }

  // --- SFX (kept from original, enhanced) ---
  playTone(freq, duration, vol = 0.1, type = 'sine') {
    if (!this.started) return;
    const osc = this.ctx.createOscillator();
    osc.type = type;
    osc.frequency.value = freq;
    const g = this.ctx.createGain();
    const now = this.ctx.currentTime;
    g.gain.setValueAtTime(0, now);
    g.gain.linearRampToValueAtTime(vol, now + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, now + duration);
    osc.connect(g).connect(this.sfxGain);
    osc.start(now);
    osc.stop(now + duration + 0.05);
  }

  playNotification() {
    this.playTone(880, 0.15, 0.08);
    setTimeout(() => this.playTone(1100, 0.12, 0.06), 100);
    setTimeout(() => this.playTone(1320, 0.08, 0.04), 180);
  }

  playConfirm() {
    this.playTone(523, 0.12, 0.07);
    setTimeout(() => this.playTone(659, 0.12, 0.07), 80);
    setTimeout(() => this.playTone(784, 0.18, 0.09), 160);
  }

  playShutter() {
    if (!this.started) return;
    const bufLen = this.ctx.sampleRate * 0.12;
    const buf = this.ctx.createBuffer(1, bufLen, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < bufLen; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufLen * 0.08));
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const g = this.ctx.createGain(); g.gain.value = 0.15;
    const f = this.ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 2200; f.Q.value = 2;
    src.connect(f).connect(g).connect(this.sfxGain);
    src.start();
    // Mechanical click after
    setTimeout(() => this.playTone(3000, 0.04, 0.06), 60);
  }

  playSearch() {
    for (let i = 0; i < 6; i++) {
      setTimeout(() => this.playTone(350 + i * 80, 0.06, 0.035, 'triangle'), i * 55);
    }
  }

  playResolve() {
    this.playTone(440, 0.35, 0.06);
    setTimeout(() => this.playTone(554, 0.35, 0.06), 150);
    setTimeout(() => this.playTone(659, 0.55, 0.09), 300);
    setTimeout(() => this.playTone(880, 0.8, 0.05), 500);
  }

  setVolume(v) {
    if (this.masterGain) {
      this.masterGain.gain.linearRampToValueAtTime(v, this.ctx.currentTime + 0.5);
    }
  }
}

// ============================================================
// VOICEOVER ENGINE — Web Speech API (Natural Professional Voice)
// ============================================================
class VoiceoverEngine {
  constructor() {
    this.synth = window.speechSynthesis;
    this.voice = null;
    this.ready = false;
    this.cueIndex = 0;
    this.isSpeaking = false;

    // Narration cues — commas add natural breathing pauses
    this.cues = [
      { time: 0.8,  text: "People don't forget, because they don't care." },
      { time: 5.0,  text: "They forget, because everyday life creates more small commitments, than memory can hold." },
      { time: 13.5, text: "Yaad, changes that." },
      { time: 16.5, text: "Just say, what matters." },
      { time: 20.0, text: "Yaad understands it, remembers it, and brings it back, when it becomes useful." },
      { time: 28.0, text: "At the right time." },
      { time: 38.0, text: "At the right place." },
      { time: 50.0, text: "Even, for the things you physically put away." },
      { time: 71.0, text: "And because the core memory engine, runs on the phone, your personal memories, stay with you." },
      { time: 82.0, text: "Yaad." },
      { time: 84.5, text: "Say it once. It remembers." },
      { time: 88.0, text: "By Team Boom. Lavanya, Vishnu, and Geetha." },
    ];
  }

  init() {
    const loadVoices = () => {
      const voices = this.synth.getVoices();
      if (voices.length === 0) return;

      // Log available voices for debugging
      console.log('Available voices:', voices.map(v => `${v.name} (${v.lang})`).join(', '));

      // --- Voice Selection Priority ---
      // Strongly prefer Enhanced / Premium neural voices (macOS)
      // These sound dramatically more natural than standard voices
      const isEnhanced = v => /enhanced|premium|neural|natural/i.test(v.name);
      const isEnglish  = v => v.lang.startsWith('en');

      this.voice =
        // 1. Enhanced Indian English (best match)
        voices.find(v => v.lang === 'en-IN' && isEnhanced(v))
        // 2. Any Indian English
        || voices.find(v => v.lang === 'en-IN')
        // 3. Enhanced British English (neutral, professional)
        || voices.find(v => v.lang === 'en-GB' && isEnhanced(v))
        // 4. Enhanced US English
        || voices.find(v => v.lang === 'en-US' && isEnhanced(v))
        // 5. Google voices (Chrome — generally good quality)
        || voices.find(v => isEnglish(v) && v.name.includes('Google'))
        // 6. Enhanced any-English
        || voices.find(v => isEnglish(v) && isEnhanced(v))
        // 7. Any British English
        || voices.find(v => v.lang === 'en-GB')
        // 8. Any English
        || voices.find(v => isEnglish(v))
        || voices[0];

      this.ready = true;
      console.log('Selected voiceover voice:', this.voice?.name, this.voice?.lang);
    };

    loadVoices();
    if (this.synth.onvoiceschanged !== undefined) {
      this.synth.onvoiceschanged = loadVoices;
    }
    // macOS sometimes needs extra time to load enhanced voices
    setTimeout(loadVoices, 300);
    setTimeout(loadVoices, 800);
    setTimeout(loadVoices, 2000);
  }

  speak(text) {
    if (!this.ready) return;

    // Cancel any currently queued utterances
    this.synth.cancel();

    const utterance = new SpeechSynthesisUtterance(text);
    if (this.voice) utterance.voice = this.voice;

    // --- Natural professional voice tuning ---
    utterance.rate   = 0.92;   // Slightly slower than normal — calm, deliberate
    utterance.pitch  = 0.95;   // Fractionally deeper — more authoritative
    utterance.volume = 1.0;    // Full voice volume (BGM ducks underneath)

    utterance.onstart = () => { this.isSpeaking = true; };
    utterance.onend   = () => { this.isSpeaking = false; };
    utterance.onerror = () => { this.isSpeaking = false; };

    // Workaround: Chrome pauses long utterances; keep synthesis alive
    this._resumeHack = setInterval(() => {
      if (this.synth.speaking) { this.synth.pause(); this.synth.resume(); }
    }, 8000);
    utterance.onend = () => {
      this.isSpeaking = false;
      clearInterval(this._resumeHack);
    };

    this.synth.speak(utterance);
  }

  update(filmTime) {
    if (this.cueIndex >= this.cues.length) return;

    const cue = this.cues[this.cueIndex];
    if (filmTime >= cue.time) {
      this.speak(cue.text);
      this.cueIndex++;
    }
  }

  reset() {
    this.synth.cancel();
    this.cueIndex = 0;
    this.isSpeaking = false;
    clearInterval(this._resumeHack);
  }
}

function clearPhoneContent() {
  phoneContent.innerHTML = '';

function setBackground(id) {
  $$('.bg-layer').forEach(l => l.classList.remove('active'));
  if (id) $(`#${id}`).classList.add('active');
}

function showSceneText(text) {
  sceneTextEl.textContent = text;
  sceneTextEl.classList.remove('exiting');
  sceneTextEl.classList.add('visible');
}

function hideSceneText() {
  sceneTextEl.classList.add('exiting');

function setCameraTransform(scale, x, y, blur) {
  cameraWrapper.style.transform = `scale(${scale}) translate(${x}px, ${y}px)`;

  // Camera push in

  setCameraTransform(pushProgress, 0, 0, 0);

  // Fade to black (10-13s)

    const fadeProgress = mapRange(t, 10, 12.5, 1, 0);
    notifCards.forEach(n => n.el.style.opacity = fadeProgress);
    phoneContainer.style.opacity = fadeProgress;

  // Scene text

    showSceneText('Life gives us hundreds of tiny things to remember.');

    showVoiceover("People don't forget because they don't care.");

let scene4Phase = 0;
let mapDotPos = { x: 0, y: 0 };
let mapTargetPos = { x: 0, y: 0 };

function initScene4() {
  setBackground('bg-street');
  phoneContainer.style.opacity = '0';
  mapContainer.style.opacity = '1';
  scene4Phase = 0;

  // Map start/target positions
  mapDotPos = { x: W() * 0.3, y: H() * 0.6 };
  mapTargetPos = { x: W() * 0.6, y: H() * 0.4 };
}

function drawMap(ctx, t) {
  const st = t - 37;
  ctx.clearRect(0, 0, W(), H());

  // Dark map background
  ctx.fillStyle = '#0d0d1a';
  ctx.fillRect(0, 0, W(), H());

  // Grid lines (subtle)
  ctx.strokeStyle = 'rgba(74,158,255,0.06)';
  ctx.lineWidth = 1;
  const gridSize = 60;
  for (let x = 0; x < W(); x += gridSize) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H());
    ctx.stroke();
  }
  for (let y = 0; y < H(); y += gridSize) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W(), y);
    ctx.stroke();
  }

  // Roads (stylized)
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 20;
  ctx.lineCap = 'round';

  // Horizontal road
  ctx.beginPath();
  ctx.moveTo(0, H() * 0.5);
  ctx.lineTo(W(), H() * 0.5);
  ctx.stroke();

  // Vertical road
  ctx.beginPath();
  ctx.moveTo(W() * 0.55, 0);
  ctx.lineTo(W() * 0.55, H());
  ctx.stroke();

  // Diagonal road
  ctx.lineWidth = 15;
  ctx.beginPath();
  ctx.moveTo(W() * 0.2, H() * 0.7);
  ctx.quadraticCurveTo(W() * 0.45, H() * 0.45, W() * 0.65, H() * 0.35);
  ctx.stroke();

  // Store building blocks
  const buildings = [
    { x: W()*0.58, y: H()*0.38, w: 50, h: 35 },
    { x: W()*0.5, y: H()*0.42, w: 40, h: 30 },
    { x: W()*0.62, y: H()*0.45, w: 35, h: 40 },
    { x: W()*0.35, y: H()*0.52, w: 45, h: 30 },
  ];
  buildings.forEach(b => {
    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 1;
    ctx.strokeRect(b.x, b.y, b.w, b.h);
  });

  // Store label
  ctx.fillStyle = 'rgba(45,212,191,0.6)';
  ctx.font = '11px Inter';
  ctx.textAlign = 'center';
  ctx.fillText('Electronics Store', mapTargetPos.x, mapTargetPos.y - 55);

  // Store marker
  ctx.beginPath();
  ctx.arc(mapTargetPos.x, mapTargetPos.y - 40, 6, 0, Math.PI * 2);
  ctx.fillStyle = 'var(--accent-teal)';
  ctx.fill();

  // Geofence ring
  if (st > 4) {
    const geoAlpha = mapRange(st, 4, 5, 0, 0.4);
    const geoScale = 1 + Math.sin(st * 2) * 0.05;
    ctx.beginPath();
    ctx.arc(mapTargetPos.x, mapTargetPos.y - 40, 80 * geoScale, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(45,212,191,${geoAlpha})`;
    ctx.lineWidth = 2;
    ctx.stroke();

    // Inner ring
    ctx.beginPath();
    ctx.arc(mapTargetPos.x, mapTargetPos.y - 40, 50 * geoScale, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(45,212,191,${geoAlpha * 0.5})`;
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // Moving dot (person)
  const moveProgress = clamp(mapRange(st, 1, 8, 0, 1), 0, 1);
  const ep = ease.inOut(moveProgress);
  mapDotPos.x = lerp(W() * 0.25, mapTargetPos.x, ep);
  mapDotPos.y = lerp(H() * 0.65, mapTargetPos.y - 40, ep);

  // Dot trail
  for (let i = 0; i < 8; i++) {
    const trailP = clamp(moveProgress - i * 0.03, 0, 1);
    const tx = lerp(W() * 0.25, mapTargetPos.x, ease.inOut(trailP));
    const ty = lerp(H() * 0.65, mapTargetPos.y - 40, ease.inOut(trailP));
    ctx.beginPath();
    ctx.arc(tx, ty, 3 - i * 0.3, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(74,158,255,${0.6 - i * 0.07})`;
    ctx.fill();
  }

  // Main dot
  ctx.beginPath();
  ctx.arc(mapDotPos.x, mapDotPos.y, 6, 0, Math.PI * 2);
  ctx.fillStyle = '#4a9eff';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(mapDotPos.x, mapDotPos.y, 10, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(74,158,255,0.3)';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Dot label
  ctx.fillStyle = 'rgba(240,240,245,0.7)';
  ctx.font = '11px Inter';
  ctx.textAlign = 'center';
  ctx.fillText('You', mapDotPos.x, mapDotPos.y + 22);
}

function initScene7() {

  techNodes.forEach(n => n.el && n.el.remove());

  // Create nodes
  techNodeData.forEach((nd, i) => {
    const node = el('div', 'tech-node', cameraWrapper);
    node.innerHTML = `<span ${nd.highlight ? 'class="tech-highlight"' : ''}>${nd.label}</span>`;
    node.style.left = `${nd.x * 100}%`;

    techNodes.push({ el: node, data: nd, showAt: i * 0.4 });
  });

  // Create connection lines
  techConnections.forEach(([from, to], i) => {
    const line = el('div', 'tech-line', cameraWrapper);
    techLines.push({ el: line, from, to, showAt: Math.max(techNodeData[from], techNodeData[to]) ? 2 + i * 0.2 : 2 + i * 0.2 });
  });
}

function updateTechLines() {
  techLines.forEach(l => {
    const fromNode = techNodes[l.from];
    const toNode = techNodes[l.to];
    if (!fromNode || !toNode) return;

    const fRect = fromNode.el.getBoundingClientRect();
    const tRect = toNode.el.getBoundingClientRect();

    const fx = fRect.left + fRect.width / 2;
    const fy = fRect.top + fRect.height / 2;
    const tx = tRect.left + tRect.width / 2;
    const ty = tRect.top + tRect.height / 2;

    const dx = tx - fx;
    const dy = ty - fy;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const angle = Math.atan2(dy, dx) * 180 / Math.PI;

    l.el.style.left = fx + 'px';
    l.el.style.top = fy + 'px';
    l.el.style.width = dist + 'px';
    l.el.style.transform = `rotate(${angle}deg)`;
  });
}

// ============================================================
// MAIN LOOP
// ============================================================
function getActiveScene(t) {
  for (let i = 0; i < scenes.length; i++) {
    if (t >= scenes[i].start && t < scenes[i].end) return i;
  }
  return scenes.length - 1;
}

function mainLoop(timestamp) {
  if (!isPlaying) return;

  currentTime = (timestamp - startTime) / 1000;
  if (currentTime >= TOTAL_DURATION) {
    // Hold on last frame
    currentTime = TOTAL_DURATION - 0.01;
  }

  const activeSceneIdx = getActiveScene(currentTime);

  // Scene transition
  if (activeSceneIdx !== currentScene) {
    // Exit previous scene
    if (currentScene >= 0) {
      const prevId = scenes[currentScene].id;
      sceneHandlers[prevId].exit();
    }

    currentScene = activeSceneIdx;
    const newId = scenes[currentScene].id;
    sceneInited[newId] = true;
    sceneHandlers[newId].init();
  }

  // Update current scene
  const scene = scenes[currentScene];
  const sceneProgress = (currentTime - scene.start) / (scene.end - scene.start);
  sceneHandlers[scene.id].update(currentTime, sceneProgress);

  // Update cinematic BGM
  audio.updateBGM(currentTime);

  // Update voiceover narration
  voiceover.update(currentTime);

  // Update particles
  fxCtx.clearRect(0, 0, W(), H());
  drawAmbient(fxCtx, timestamp);
  particles = particles.filter(p => p.alive);
  particles.forEach(p => { p.update(); p.draw(fxCtx); });

  requestAnimationFrame(mainLoop);
}
